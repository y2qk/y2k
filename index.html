<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>y.1q. // Y2K Gothic Void</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { scroll-behavior: smooth; }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* Mouse Glow */
        #cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 280px; height: 280px;
            margin-left: -140px; margin-top: -140px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9999;
        }

        /* Matrix Canvas Background */
        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.12;
            pointer-events: none;
        }

        /* CRT Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.35),
                rgba(0, 0, 0, 0.35) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 2;
        }

        /* Floating Gothic Quotes (Side Text) */
        .floating-quote {
            position: fixed;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: lowercase;
            pointer-events: none;
            z-index: 4;
            transition: opacity 1.5s ease, transform 1.5s ease;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }

        /* Section Layout */
        .section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3;
            padding: 60px 20px;
        }

        /* Y2K Dark Card Base */
        .card {
            position: relative;
            background: rgba(8, 8, 10, 0.92);
            border: 2px solid #222;
            padding: 45px 35px;
            width: 390px;
            text-align: center;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08), inset 0 0 15px rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            transition: all 0.5s ease;
        }

        /* Fixed Spider (Bug-Free JS Animated) */
        .spider-box {
            position: absolute;
            top: 0;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .spider-thread {
            width: 1px;
            height: 45px;
            background: rgba(255, 255, 255, 0.3);
            transition: height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .spider-icon {
            width: 22px;
            height: 22px;
            fill: #aaa;
            filter: drop-shadow(0 0 5px #fff);
            transition: fill 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }

        /* Center Butterfly Logo */
        .butterfly-svg {
            width: 50px;
            height: auto;
            fill: #ccc;
            filter: drop-shadow(0 0 8px #fff);
            margin-bottom: 15px;
            margin-top: 10px;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.7; filter: drop-shadow(0 0 4px #fff); transform: scale(0.98); }
            100% { opacity: 1; filter: drop-shadow(0 0 12px #fff); transform: scale(1.03); }
        }

        h1 {
            font-size: 34px;
            color: #fff;
            letter-spacing: 3px;
            text-transform: lowercase;
            margin-bottom: 5px;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 2px 2px 0px #111;
        }

        .subtitle {
            color: #888;
            font-size: 11px;
            letter-spacing: 2.5px;
            margin-bottom: 25px;
        }

        .dc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #444;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .dc-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 25px #fff;
            border-color: #fff;
        }

        .dc-icon { width: 20px; height: 20px; fill: currentColor; }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: #666;
            letter-spacing: 3px;
            animation: bounce 1.8s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); opacity: 0.5; }
            to { transform: translateY(-8px); opacity: 1; }
        }

        /* Gothic Boxes for Minigames */
        .gothic-box {
            background: #000;
            border: 1px dashed #444;
            padding: 20px;
            border-radius: 4px;
            margin-top: 15px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.02);
        }

        .click-btn {
            background: #000;
            color: #fff;
            border: 1px solid #888;
            padding: 12px 25px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .click-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px #fff;
        }

        /* Pattern Minigame Grid */
        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .pattern-node {
            background: #111;
            border: 1px solid #333;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pattern-node:hover {
            border-color: #fff;
            background: #222;
        }

        .pattern-node.active {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px #fff;
        }

        /* Scroll Animation */
        .reveal-card {
            opacity: 0;
            transform: translateY(50px) scale(0.95);
        }

        .reveal-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>

    <div id="cursor-glow"></div>
    <div class="scanlines"></div>
    <canvas id="matrix-canvas"></canvas>

    <!-- Side Quotes Container -->
    <div id="quote-left" class="floating-quote" style="left: 40px; top: 40%;"></div>
    <div id="quote-right" class="floating-quote" style="right: 40px; top: 60%;"></div>

    <!-- SECTION 1: PROFILE -->
    <div class="section" id="sec1">
        <div class="card">

            <div class="spider-box" id="spiderBox">

                </svg>
            </div>

            <!-- Single Butterfly -->
            <svg class="butterfly-svg" viewBox="0 0 24 24">
                <path d="M12 12c1.5-2.5 4-4 7-4 0 3-1.5 5.5-4 7 2.5 1.5 4 4 4 7-3 0-5.5-1.5-7-4-1.5 2.5-4 4-7 4 0-3 1.5-5.5 4-7-2.5-1.5-4-4-4-7 3 0 5.5 1.5 7 4z"/>
            </svg>

            <h1>y.1q.</h1>
            <div class="subtitle">✦ 𐕣 GHOST // Y2K GOTHIC 𐕣 ✦</div>

            <a href="https://discord.com/users/SENIN_DISCORD_ID_NUMARAN" target="_blank" class="dc-btn">
                <svg class="dc-icon" viewBox="0 0 127.14 96.36">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0, -3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.33,85.25a68.42,68.42,0,0,1,-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1,-10.87,5.19,77,77,0,0,0,6.6,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.41-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.81,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91.05,65.69,84.69,65.69Z"/>
                </svg>
                ENTER VOID (DISCORD)
            </a>
        </div>
        <div class="scroll-hint">▼ SCROLL FOR MINIGAMES ▼</div>
    </div>

    <!-- SECTION 2: CLICKER (PERMANENT SAVED) -->
    <div class="section" id="sec2">
        <div class="card reveal-card">
            <h1>soul harvest</h1>
            <div class="subtitle">✦ SAVED SYSTEM CLICKS ✦</div>
            
            <div class="gothic-box">
                <p style="font-size: 10px; color: #666; letter-spacing: 2px;">YOUR SAVED HARVEST</p>
                <h2 id="local-score" style="font-size: 36px; margin: 12px 0; color: #fff; text-shadow: 0 0 10px #fff;">0</h2>
                <button class="click-btn" onclick="addLocalScore()">HARVEST SOUL 𐕣</button>
            </div>
        </div>
    </div>

    <!-- SECTION 3: PATTERN MEMORY MINIGAME -->
    <div class="section" id="sec3">
        <div class="card reveal-card">
            <h1>void pattern</h1>
            <div class="subtitle">✦ GOTHIC MEMORY SYSTEM ✦</div>
            
            <div class="gothic-box">
                <p id="game-status" style="font-size: 11px; color: #aaa;">PRESS START TO BEGIN</p>
                
                <div class="pattern-grid">
                    <div class="pattern-node" onclick="nodeClick(0)">𐕣</div>
                    <div class="pattern-node" onclick="nodeClick(1)">✦</div>
                    <div class="pattern-node" onclick="nodeClick(2)">🕷</div>
                    <div class="pattern-node" onclick="nodeClick(3)">🦋</div>
                    <div class="pattern-node" onclick="nodeClick(4)">⚔</div>
                    <div class="pattern-node" onclick="nodeClick(5)">☠</div>
                </div>

                <button class="click-btn" onclick="startPatternGame()">START PATTERN</button>
            </div>
        </div>
    </div>

    <script>
        // Cursor Glow
        const glow = document.getElementById('cursor-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        });

        // Bug-Free Spider Animation
        const spiderBox = document.getElementById('spiderBox');
        const spiderThread = document.getElementById('spiderThread');
        const spiderIcon = document.getElementById('spiderIcon');

        spiderBox.addEventListener('mouseenter', () => {
            spiderThread.style.height = '15px';
            spiderIcon.style.fill = '#fff';
            spiderIcon.style.transform = 'scale(1.2)';
        });

        spiderBox.addEventListener('mouseleave', () => {
            spiderThread.style.height = '45px';
            spiderIcon.style.fill = '#aaa';
            spiderIcon.style.transform = 'scale(1)';
        });

        // Matrix Rain
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01Y2K_GHOST_X_Q_Z_𐕣_✦_☠';
        const fontSize = 12;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Floating Gothic Quotes
        const quotes = [
            "lost in cyber space...",
            "stars bleed in silence.",
            "into the endless void.",
            "we are digital ghosts.",
            "dancing in the shadows.",
            "gothic energy online.",
            "memories faded in 2000."
        ];

        function rotateQuotes() {
            const leftElem = document.getElementById('quote-left');
            const rightElem = document.getElementById('quote-right');

            leftElem.style.opacity = 0;
            rightElem.style.opacity = 0;

            setTimeout(() => {
                leftElem.innerText = quotes[Math.floor(Math.random() * quotes.length)];
                rightElem.innerText = quotes[Math.floor(Math.random() * quotes.length)];
                leftElem.style.opacity = 0.5;
                rightElem.style.opacity = 0.5;
            }, 1500);
        }
        rotateQuotes();
        setInterval(rotateQuotes, 6000);

        // Permanent Saved Clicker
        let savedScore = parseInt(localStorage.getItem('y1q_harvest_score')) || 0;
        document.getElementById('local-score').innerText = savedScore;

        function addLocalScore() {
            savedScore++;
            localStorage.setItem('y1q_harvest_score', savedScore);
            document.getElementById('local-score').innerText = savedScore;
        }

        // Pattern Minigame Logic
        let sequence = [];
        let playerSequence = [];
        let isPlaying = false;
        const nodes = document.querySelectorAll('.pattern-node');
        const statusText = document.getElementById('game-status');

        function startPatternGame() {
            sequence = [];
            playerSequence = [];
            isPlaying = true;
            nextRound();
        }

        function nextRound() {
            playerSequence = [];
            sequence.push(Math.floor(Math.random() * 6));
            statusText.innerText = "WATCH PATTERN...";
            playSequence();
        }

        function playSequence() {
            let i = 0;
            const interval = setInterval(() => {
                flashNode(sequence[i]);
                i++;
                if (i >= sequence.length) {
                    clearInterval(interval);
                    statusText.innerText = "YOUR TURN!";
                }
            }, 600);
        }

        function flashNode(index) {
            nodes[index].classList.add('active');
            setTimeout(() => nodes[index].classList.remove('active'), 300);
        }

        function nodeClick(index) {
            if (!isPlaying) return;
            flashNode(index);
            playerSequence.push(index);

            if (playerSequence[playerSequence.length - 1] !== sequence[playerSequence.length - 1]) {
                statusText.innerText = "WRONG! GAME OVER.";
                isPlaying = false;
                return;
            }

            if (playerSequence.length === sequence.length) {
                statusText.innerText = "CORRECT! NEXT LEVEL...";
                setTimeout(nextRound, 1000);
            }
        }

        // Scroll Observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('.reveal-card').forEach(card => {
            observer.observe(card);
        });
    </script>
</body>
</html>
