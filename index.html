<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>y.1q. // Y2K Gothic Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* Mouse Glow */
        #cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 250px; height: 250px;
            margin-left: -125px; margin-top: -125px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9999;
        }

        /* Matrix Rain Canvas BG */
        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }

        /* CRT Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 2;
        }

        /* Section Layout for Smooth Scrolling */
        .section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3;
            padding: 40px 20px;
        }

        /* Card Base Style */
        .card {
            background: rgba(10, 10, 12, 0.9);
            border: 1px solid #333;
            padding: 40px 30px;
            width: 380px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        /* Bat Graphic SVG */
        .bat-svg {
            width: 60px;
            height: auto;
            fill: #666;
            filter: drop-shadow(0 0 5px #fff);
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .bat-svg:hover {
            fill: #fff;
            filter: drop-shadow(0 0 12px #fff);
            transform: scale(1.15) rotate(-5deg);
        }

        /* Butterfly SVG */
        .butterfly-svg {
            width: 45px;
            height: auto;
            fill: #aaa;
            filter: drop-shadow(0 0 8px #fff);
            margin-bottom: 15px;
            animation: pulse 2.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        h1 {
            font-size: 32px;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #fff;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .dc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #444;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .dc-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px #fff;
        }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        /* Minigame Section */
        .game-box {
            background: #000;
            border: 1px dashed #555;
            padding: 20px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .click-btn {
            background: #111;
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .click-btn:active {
            transform: scale(0.95);
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="cursor-glow"></div>
    <div class="scanlines"></div>
    <canvas id="matrix-canvas"></canvas>

    <!-- SECTION 1: MAIN CARD -->
    <div class="section" id="sec1">
        <div class="card">
            <!-- Vector Bat Graphic -->
            <svg class="bat-svg" viewBox="0 0 24 24">
                <path d="M12 4c-1.5 0-2.8 1.2-3 2.7C7.2 5.6 5 5 3 6c0 0 1.5 3 3 4.5C4 11 2 13 2 16c3.5 0 6.5-2 8-5 1.5 3 4.5 5 8 5 0-3-2-5-4-5.5 1.5-1.5 3-4.5 3-4.5-2-1-4.2-.4-6 .7-.2-1.5-1.5-2.7-3-2.7z"/>
            </svg>
            <br>
            <!-- Vector Butterfly Graphic -->
            <svg class="butterfly-svg" viewBox="0 0 24 24">
                <path d="M12 12c1.5-2.5 4-4 7-4 0 3-1.5 5.5-4 7 2.5 1.5 4 4 4 7-3 0-5.5-1.5-7-4-1.5 2.5-4 4-7 4 0-3 1.5-5.5 4-7-2.5-1.5-4-4-4-7 3 0 5.5 1.5 7 4z"/>
            </svg>

            <h1>y.1q.</h1>
            <div class="subtitle">✦ GHOST // Y2K GOTHIC ✦</div>

            <a href="https://discord.com/users/SENIN_DISCORD_ID_NUMARAN" target="_blank" class="dc-btn">
                ENTER VOID (DISCORD)
            </a>
        </div>
        <div class="scroll-hint">▼ SCROLL DOWN ▼</div>
    </div>

    <!-- SECTION 2: Y2K MINIGAME / EXTRA CONTENT -->
    <div class="section" id="sec2">
        <div class="card">
            <h1>y2k zone</h1>
            <div class="subtitle">✦ MINI CLICKER SYSTEM ✦</div>
            
            <div class="game-box">
                <p style="font-size: 12px; color: #aaa;">SYSTEM ENERGY</p>
                <h2 id="score" style="font-size: 28px; margin: 10px 0;">0</h2>
                <button class="click-btn" onclick="addScore()">CLICK TO HARVEST</button>
            </div>
        </div>
    </div>

    <script>
        // Cursor Glow
        const glow = document.getElementById('cursor-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        });

        // Matrix Digital Rain
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01Y2K_GHOST_X_Q_Z';
        const fontSize = 12;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Clicker Game
        let count = 0;
        function addScore() {
            count++;
            document.getElementById('score').innerText = count;
        }
    </script>
</body>
</html>
