        body {

        /* Y2K Dark Card Structure */
        .card {
            position: relative;
            background: rgba(13, 13, 18, 0.85);
            border: 1px solid rgba(255, 0, 127, 0.4);
            padding: 40px 30px;
            width: 380px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            backdrop-filter: blur(10px);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .butterfly {
            font-size: 28px;
            margin-bottom: 10px;
            display: inline-block;
            filter: drop-shadow(0 0 8px #ff007f);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #00ffcc); }
        }

        h1 {
            font-size: 32px;
            color: #fff;

        }

        .subtitle {

            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-shadow: 0 0 5px #00ffcc;
        }

        .dc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #ff007f;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dc-btn:hover {
            background: #ff007f;
            color: #000;
            box-shadow: 0 0 20px #ff007f, 0 0 30px #00ffcc;
            transform: scale(1.02);
        }

        .dc-icon {
            width: 20px;

            fill: currentColor;
        }

        .footer-tag {
