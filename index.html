        /* Modern 60 FPS Performance Rules */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            overflow: hidden; 
            height: 100%;
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        /* Black & White Y2K Grid Background with Ghost Drip Drip */
        body {
            background-color: #000;
            background-image: 
                linear-gradient(rgba(30, 30, 30, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 30, 30, 0.4) 1px, transparent 1px);
            background-size: 30px 30px, 30px 30px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Starts hidden for intro */
            animation: globalIntro 0.6s ease-out forwards 0.2s;
        }

        @keyframes globalIntro {
            to { opacity: 1; }
        }

        /* Y2K Dark Card - Siyah & Beyaz Glow */
        .card {
            position: relative;
            background: rgba(8, 8, 8, 0.95);
            border: 2px solid #222;
            padding: 40px 30px;
            width: 380px;
            text-align: center;
            border-radius: 8px;
            /* Black & White Neon/Ghost Glow */
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1), inset 0 0 10px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            transform: translateZ(0); /* Force 60 FPS Acceleration */
            will-change: transform;
            animation: float60fps 6s ease-in-out infinite, ghostCardIntro 0.5s ease-out forwards 0.4s;
            opacity: 0;
            cursor: default;
        }

        /* Ultra Smooth floating animation */
        @keyframes float60fps {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -6px, 0); }
        }

        /* Glitchy/Ghost Intro for the whole card */
        @keyframes ghostCardIntro {
            0% { opacity: 0; transform: scale(1.1) translateZ(0); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0); }
        }

        /* Cyber-Goth/Ghost ASCII Butterfly (Based on your style) */
        .butterfly-ascii {
            font-size: 8px;
            line-height: 8px;
            white-space: pre;
            color: #ccc;
            text-shadow: 0 0 6px #fff;
            margin-bottom: 15px;
            display: inline-block;
            animation: ghostButt 3s infinite alternate, flyButtIntro 0.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes ghostButt {
            0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 5px #fff); }
            50% { opacity: 1; filter: drop-shadow(0 0 10px #aaa) drop-shadow(0 0 15px #eee); }
        }

        /* Butterfly flying-out intro */
        @keyframes flyButtIntro {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header Style - Monochromatic Cyber Hacker */
        h1 {
            font-size: 34px;
            color: #fff;
            letter-spacing: 2px;
            text-transform: lowercase;
            margin-bottom: 5px;
            text-shadow: 0 0 3px #fff, 1px 1px 0px #111;
            opacity: 0;
            animation: ghostTextIntro 0.4s ease-out forwards 0.6s;
        }

        /* Black/White Neon Ghost Text Effect */
        .subtitle {
            color: #999;
            font-size: 11px;
            letter-spacing: 2.5px;
            margin-bottom: 25px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
            opacity: 0;
            animation: ghostTextIntro 0.4s ease-out forwards 0.8s;
        }

        @keyframes ghostTextIntro {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Black & White Y2K Ghost Button */
        .dc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid #555;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            transform: translateZ(0); /* FPS boost */
            opacity: 0;
            animation: ghostTextIntro 0.4s ease-out forwards 1.0s;
        }

        .dc-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 25px #fff, 0 0 10px #aaa;
            border-color: #fff;
            letter-spacing: 1px;
        }

        .dc-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: all 0.3s ease;
        }

        .dc-btn:hover .dc-icon {
            transform: scale(1.1);
        }

        .footer-tag {
            margin-top: 25px;
            font-size: 11px;
            color: #444;
            letter-spacing: 3px;
            opacity: 0;
            animation: ghostTextIntro 0.4s ease-out forwards 1.2s;
        }

        /* Ghost/Drip Pattern on BG */
        .ghost-drip {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(10,10,10,0.5) 0%, transparent 100%),
                repeating-linear-gradient(0deg, #111, #111 2px, transparent 2px, transparent 15px);
            opacity: 0.1;
            z-index: -1;
        }
    </style>
