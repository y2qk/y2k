<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>y.1q. // Y2K Gothic Void</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { scroll-behavior: smooth; }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* Mouse Glow */
        #cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 280px; height: 280px;
            margin-left: -140px; margin-top: -140px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9999;
        }

        /* Matrix Canvas Background */
        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }

        /* CRT Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.35),
                rgba(0, 0, 0, 0.35) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 2;
        }

        /* Neon Glow Floating Side Quotes */
        .quote-column {
            position: fixed;
            top: 0;
            width: 220px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            pointer-events: none;
            z-index: 4;
        }

        .quote-left-col { left: 20px; }
        .quote-right-col { right: 20px; text-align: right; }

        .side-quote {
            font-size: 11px;
            color: #fff;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-shadow: 0 0 8px #fff, 0 0 15px rgba(255, 255, 255, 0.8);
            opacity: 0;
            transition: opacity 1.2s ease, transform 1.2s ease;
            white-space: nowrap;
        }

        .side-quote.indent-1 { transform: translateX(15px); }
        .side-quote.indent-2 { transform: translateX(-10px); }
        .side-quote.indent-3 { transform: translateX(25px); }

        /* Section Layout */
        .section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3;
            padding: 60px 20px;
            perspective: 1000px;
        }

        /* Y2K Dark Card Base */
        .card {
            position: relative;
            background: rgba(8, 8, 10, 0.94);
            border: 2px solid #222;
            padding: 45px 35px;
            width: 390px;
            text-align: center;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08), inset 0 0 15px rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Hanging Spider on Bottom-Right Corner */
        .spider-box-bottom {
            position: absolute;
            bottom: -55px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .spider-thread-bottom {
            width: 1px;
            height: 40px;
            background: rgba(255, 255, 255, 0.4);
            transition: height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 4px #fff;
        }

        .spider-icon-bottom {
            width: 22px;
            height: 22px;
            fill: #aaa;
            filter: drop-shadow(0 0 6px #fff);
            transition: fill 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }

        /* Center Butterfly Logo */
        .butterfly-svg {
            width: 50px;
            height: auto;
            fill: #ccc;
            filter: drop-shadow(0 0 8px #fff);
            margin-bottom: 15px;
            margin-top: 10px;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.7; filter: drop-shadow(0 0 4px #fff); transform: scale(0.98); }
            100% { opacity: 1; filter: drop-shadow(0 0 12px #fff); transform: scale(1.03); }
        }

        h1 {
            font-size: 34px;
            color: #fff;
            letter-spacing: 3px;
            text-transform: lowercase;
            margin-bottom: 5px;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 2px 2px 0px #111;
        }

        .subtitle {
            color: #888;
            font-size: 11px;
            letter-spacing: 2.5px;
            margin-bottom: 25px;
        }

        .dc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #444;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .dc-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 25px #fff;
            border-color: #fff;
        }

        .dc-icon { width: 20px; height: 20px; fill: currentColor; }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: #666;
            letter-spacing: 3px;
            animation: bounce 1.8s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); opacity: 0.5; }
            to { transform: translateY(-8px); opacity: 1; }
        }

        /* Gothic Boxes for Minigames */
        .gothic-box {
            background: #000;
            border: 1px dashed #444;
            padding: 20px;
            border-radius: 4px;
            margin-top: 15px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.02);
        }

        .click-btn {
            background: #000;
            color: #fff;
            border: 1px solid #888;
            padding: 12px 25px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .click-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px #fff;
        }

        /* Pattern Minigame Grid */
        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .pattern-node {
            background: #111;
            border: 1px solid #333;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pattern-node:hover {
            border-color: #fff;
            background: #222;
        }

        .pattern-node.active {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px #fff;
        }

        /* Repeating Scroll Animation Classes */
        .reveal-card {
            opacity: 0;
            transform: translateY(70px) scale(0.9) rotateX(15deg);
        }

        .reveal-card.active {
            opacity: 1;
            transform: translateY(0) scale(1) rotateX(0deg);
        }

        /* System Status Log (Bottom Area) */
        .system-log {
            font-size: 10px;
            color: #555;
            text-align: left;
            margin-top: 15px;
            line-height: 1.6;
            border-top: 1px solid #222;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <!-- SECTION 2: CLICKER (PERMANENT SAVED) -->
    <div class="section" id="sec2">
        <div class="card reveal-card">
            <h1>soul harvest</h1>
            <div class="subtitle">✦ SAVED SYSTEM CLICKS ✦</div>
            
            <div class="gothic-box">
                <p style="font-size: 10px; color: #666; letter-spacing: 2px;">YOUR SAVED HARVEST</p>
                <h2 id="local-score" style="font-size: 36px; margin: 12px 0; color: #fff; text-shadow: 0 0 10px #fff;">0</h2>

    <!-- SECTION 3: PATTERN MEMORY MINIGAME & LOGS -->
    <div class="section" id="sec3">
        <div class="card reveal-card">
            <h1>void pattern</h1>
            <div class="subtitle">✦ GOTHIC MEMORY SYSTEM ✦</div>
            
            <div class="gothic-box">
                <p id="game-status" style="font-size: 11px; color: #aaa;">PRESS START TO BEGIN</p>
                
                <div class="pattern-grid">
                    <div class="pattern-node" onclick="nodeClick(0)">𐕣</div>
                    <div class="pattern-node" onclick="nodeClick(1)">✦</div>
                    <div class="pattern-node" onclick="nodeClick(2)">🕷</div>
                    <div class="pattern-node" onclick="nodeClick(3)">🦋</div>
                    <div class="pattern-node" onclick="nodeClick(4)">⚔</div>
                    <div class="pattern-node" onclick="nodeClick(5)">☠</div>
                </div>

                <button class="click-btn" onclick="startPatternGame()">START PATTERN</button>
            </div>

            <div class="system-log">
                &gt; SYSTEM: ONLINE<br>
                &gt; CORE: GHOST_Y2K_V2.0<br>
                &gt; STATUS: ENCRYPTED
            </div>
        </div>
    </div>

    <script>
        // Cursor Glow
        const glow = document.getElementById('cursor-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        });

        // Spider Animation (Bottom Right)
        const spiderBox = document.getElementById('spiderBox');
        const spiderThread = document.getElementById('spiderThread');
        const spiderIcon = document.getElementById('spiderIcon');

        spiderBox.addEventListener('mouseenter', () => {
            spiderThread.style.height = '10px';
            spiderIcon.style.fill = '#fff';
            spiderIcon.style.transform = 'scale(1.25)';
        });

        spiderBox.addEventListener('mouseleave', () => {
            spiderThread.style.height = '40px';
            spiderIcon.style.fill = '#aaa';
            spiderIcon.style.transform = 'scale(1)';
        });

        // Matrix Rain
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01Y2K_GHOST_X_Q_Z_𐕣_✦_☠';
        const fontSize = 12;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Async Independent Floating Quotes
        const quotesPool = [
            "lost in cyber space...",
            "stars bleed in silence.",
            "into the endless void.",
            "we are digital ghosts.",
            "dancing in the shadows.",
            "gothic energy online.",
            "memories faded in 2000.",
            "forever in the dark.",
            "whispers of the void.",
            "cold digital rain."
        ];

        const quoteElems = [
            document.getElementById('lq1'),
            document.getElementById('lq2'),
            document.getElementById('lq3'),
            document.getElementById('rq1'),
            document.getElementById('rq2'),
            document.getElementById('rq3')
        ];

        quoteElems.forEach((elem, index) => {
            function cycleQuote() {
                elem.style.opacity = 0;
                setTimeout(() => {
                    elem.innerText = quotesPool[Math.floor(Math.random() * quotesPool.length)];
                    elem.style.opacity = 0.8;
                }, 1000);
            }
            cycleQuote();
            setInterval(cycleQuote, 3500 + (index * 1200)); // Independent random timings
        });

        // Saved Clicker Score
        let savedScore = parseInt(localStorage.getItem('y1q_harvest_score')) || 0;
        document.getElementById('local-score').innerText = savedScore;

        function addLocalScore() {
            savedScore++;
            localStorage.setItem('y1q_harvest_score', savedScore);
            document.getElementById('local-score').innerText = savedScore;
        }

        // Pattern Minigame
        let sequence = [];
        let playerSequence = [];
        let isPlaying = false;
        const nodes = document.querySelectorAll('.pattern-node');
        const statusText = document.getElementById('game-status');

        function startPatternGame() {
            sequence = [];
            playerSequence = [];
            isPlaying = true;
            nextRound();
        }

        function nextRound() {
            playerSequence = [];
            sequence.push(Math.floor(Math.random() * 6));
            statusText.innerText = "WATCH PATTERN...";
            playSequence();
        }

        function playSequence() {
            let i = 0;
            const interval = setInterval(() => {
                flashNode(sequence[i]);
                i++;
                if (i >= sequence.length) {
                    clearInterval(interval);
                    statusText.innerText = "YOUR TURN!";
                }
            }, 600);
        }

        function flashNode(index) {
            nodes[index].classList.add('active');
            setTimeout(() => nodes[index].classList.remove('active'), 300);
        }

        function nodeClick(index) {
            if (!isPlaying) return;
            flashNode(index);
            playerSequence.push(index);

            if (playerSequence[playerSequence.length - 1] !== sequence[playerSequence.length - 1]) {
                statusText.innerText = "WRONG! GAME OVER.";
                isPlaying = false;
                return;
            }

            if (playerSequence.length === sequence.length) {
                statusText.innerText = "CORRECT! NEXT LEVEL...";
                setTimeout(nextRound, 1000);
            }
        }

        // Continuous Repeating Scroll Observer (Triggers every time in view)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                } else {
                    entry.target.classList.remove('active'); // Resets animation when scrolled away
                }
            });
        }, { threshold: 0.25 });

        document.querySelectorAll('.reveal-card').forEach(card => {
            observer.observe(card);
        });
    </script>
</body>
